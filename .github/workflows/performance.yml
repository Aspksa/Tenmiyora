name: Нагрузочное испытание Мозга
on:
  pull_request:
    paths:
      - 'bootstrap/performance_benchmark.py'
      - 'bootstrap/memory_engine.py'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - documents: 1000
            paragraphs: 3
          - documents: 10000
            paragraphs: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Измерить масштабируемость поиска, памяти и источников
        run: python bootstrap/performance_benchmark.py --documents ${{ matrix.documents }} --paragraphs ${{ matrix.paragraphs }} --queries 100 --check --output .runtime/performance
      - name: Опубликовать машинно-читаемый отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenmiyora-performance-${{ matrix.documents }}
          path: .runtime/performance/*.json
          if-no-files-found: warn
