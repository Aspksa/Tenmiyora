name: Проверка запуска
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '17 2 * * 1'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Проверить синтаксис исходников Python
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          roots = [Path('bootstrap'), Path('tests')]
          paths = [p for root in roots if root.is_dir() for p in root.rglob('*.py')]
          if not paths:
              raise SystemExit('Не найдены Python-файлы для проверки')
          for path in paths:
              ast.parse(path.read_bytes(), filename=str(path))
          print(f'Проверено Python-файлов: {len(paths)}')
          PY
      - name: Проверить синтаксис JavaScript
        run: |
          node --check web/app.js
          node --check web/layout.js
          node --check web/markdown.js
          node --check web/knowledge.js
      - name: Проверить базовые регрессии тестового разделения
        run: python bootstrap/ci_timed.py --label 'Разделение тестов' -- python -m unittest discover -s tests -p 'test_test_shard.py' -v
      - name: Проверить веб-макет
        run: python bootstrap/ci_timed.py --label 'Веб-макет' -- node --test tests/layout.test.cjs tests/markdown.test.cjs
      - name: Установить зависимости защитных регрессий
        run: python bootstrap/ci_timed.py --label 'Установка pypdf' -- python -m pip install -r requirements-ci.txt
      - name: Проверить обе независимые защитные регрессии параллельно
        run: python bootstrap/ci_timed.py --label 'Защитные регрессии параллельно' -- python bootstrap/ci_parallel_quick.py

      - name: Сквозной экзамен достоверности ответов
        run: python bootstrap/ci_timed.py --label 'Цепочка доказательств' -- python -m unittest discover -s tests -p 'test_evidence_chain.py' -v

      - name: Сравнить точность до и после роста памяти
        run: python bootstrap/ci_timed.py --label 'Рост качества знаний' -- python bootstrap/knowledge_growth_exam.py --check --output .runtime/quality-reports/knowledge-growth.json

      - name: Проверить надёжное чтение PDF
        run: python bootstrap/ci_timed.py --label 'Устойчивость PDF' -- python -m unittest discover -s tests -p 'test_pdf_robust.py' -v

      - name: PDF — понимание условий и точные цитаты
        run: python bootstrap/ci_timed.py --label 'PDF evidence' -- python -m unittest discover -s tests -p 'test_pdf_evidence.py' -v

      - name: PDF — контроль OCR и полноты страниц
        run: python bootstrap/ci_timed.py --label 'PDF OCR coverage' -- python -m unittest discover -s tests -p 'test_pdf_ocr_coverage.py' -v

      - name: Проверить развитие личности Tenmiyora
        run: python bootstrap/ci_timed.py --label 'Soul evolution' -- python -m unittest discover -s tests -p 'test_soul_evolution.py' -v

      - name: Проверить память отношений Tenmiyora
        run: python bootstrap/ci_timed.py --label 'Relationship memory' -- python -m unittest discover -s tests -p 'test_relationship_memory.py' -v

      - name: Проверить рост характера по обратной связи
        run: python bootstrap/ci_timed.py --label 'Soul feedback growth' -- python -m unittest discover -s tests -p 'test_soul_feedback_growth.py' -v

      - name: Проверить опыт и развитие личности
        run: python -m unittest discover -s tests -p 'test_soul_experience.py' -v
      - name: Проверить память реально завершённых операций
        run: python bootstrap/ci_timed.py --label 'Verified soul outcomes' -- python -m unittest discover -s tests -p 'test_verified_soul_outcomes.py' -v

      - name: Проверить взросление личности
        run: python bootstrap/ci_timed.py --label 'Soul maturation' -- python -m unittest discover -s tests -p 'test_soul_maturation.py' -v

      - name: Проверить качество привычек личности
        run: python bootstrap/ci_timed.py --label 'Soul quality' -- python -m unittest discover -s tests -p 'test_soul_quality.py' -v

      - name: Проверить память подтверждённых ошибок
        run: python bootstrap/ci_timed.py --label 'Verified failures' -- python -m unittest discover -s tests -p 'test_soul_failures.py' -v

      - name: Проверить навыки восстановления после ошибок
        run: python bootstrap/ci_timed.py --label 'Verified recovery' -- python -m unittest discover -s tests -p 'test_soul_recovery.py' -v

      - name: Проверить шесть инвариантов Лаборатории
        run: python bootstrap/ci_timed.py --label 'Метаморфные проверки' -- python bootstrap/brain_lab_metamorphic.py --check --output .runtime/quality-reports/brain-lab-metamorphic.json
      - name: Проверить блокировки принятия и SHA-пломбу инвариантов
        run: python bootstrap/ci_timed.py --label 'Контроль регрессий лаборатории' -- python -m unittest discover -s tests -p 'test_brain_lab_metamorphic.py' -v

      - name: Три самых медленных этапа
        if: always()
        run: python bootstrap/ci_timed.py --report

  check:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Проверить PowerShell 5.1
        if: runner.os == 'Windows' && matrix.shard == 0
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem bootstrap,tests -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
      - name: Подготовить декодер PDF для контрольных документов
        run: python bootstrap/ci_timed.py --label 'Установка pypdf' -- python -m pip install -r requirements-ci.txt
      - name: Проверить сервер, Мозг и запуск BAT — часть ${{ matrix.shard }}
        run: python bootstrap/ci_timed.py --label 'Unittest shard' -- python bootstrap/test_shard.py --shard ${{ matrix.shard }} --total 4

      - name: Три самых медленных этапа
        if: always()
        run: python bootstrap/ci_timed.py --report

  lab-exams:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'schedule'
    name: Лаборатория (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Подготовить PDF-декодер
        run: python bootstrap/ci_timed.py --label 'Установка pypdf' -- python -m pip install -r requirements-ci.txt
      - name: Проверить 8 поведенческих экзаменов
        run: python bootstrap/ci_timed.py --label '8 экзаменов' -- python bootstrap/brain_lab_eight.py --check --output .runtime/quality-reports/brain-lab-eight.json
      - name: Проверить 5 негативных экзаменов
        run: python bootstrap/ci_timed.py --label '5 негативных экзаменов' -- python bootstrap/brain_lab_adversarial.py --check --output .runtime/quality-reports/brain-lab-adversarial.json
      - name: Проверить шесть метаморфных испытаний
        run: python bootstrap/ci_timed.py --label '6 инвариантов' -- python bootstrap/brain_lab_metamorphic.py --check --output .runtime/quality-reports/brain-lab-metamorphic.json
      - name: Проверить 12 внутренних аудитов
        run: python bootstrap/ci_timed.py --label '12 аудитов' -- python bootstrap/brain_lab_audit.py --check --output .runtime/quality-reports/brain-lab-audit.json

      - name: Три самых медленных этапа
        if: always()
        run: python bootstrap/ci_timed.py --report

  quality:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Подготовить декодер PDF для контрольных документов
        run: python bootstrap/ci_timed.py --label 'Установка pypdf' -- python -m pip install -r requirements-ci.txt
      - name: Экзамен качества DOCX XLSX PDF и цитирования
        run: python bootstrap/ci_timed.py --label 'Экзамен документов' -- python bootstrap/document_quality_exam.py --check --output .runtime/quality-reports
      - name: Измерить качество извлечения знаний и поиска
        run: python bootstrap/ci_timed.py --label 'Качество знаний' -- python bootstrap/quality_eval.py --check --output .runtime/quality-reports
      - name: Проверить 80 сложных документов и качество поиска
        run: python bootstrap/ci_timed.py --label '80 документов' -- python bootstrap/quality_stress.py --check --output .runtime/quality-reports
      - name: Проверить измеритель производительности на 60 документах
        run: python bootstrap/ci_timed.py --label 'Производительность' -- python bootstrap/performance_benchmark.py --documents 60 --paragraphs 3 --queries 20 --check --output .runtime/quality-reports
      - name: Три самых медленных этапа
        if: always()
        run: python bootstrap/ci_timed.py --report
      - name: Сохранить диагностические отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}
          path: .runtime/quality-reports/*.json
          if-no-files-found: warn
