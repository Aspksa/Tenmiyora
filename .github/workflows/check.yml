name: Проверка запуска
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
permissions:
  contents: read
jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Проверить синтаксис исходников Python
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          roots = [Path('bootstrap'), Path('tests')]
          paths = [p for root in roots if root.is_dir() for p in root.rglob('*.py')]
          if not paths:
              raise SystemExit('Не найдены Python-файлы для проверки')
          for path in paths:
              ast.parse(path.read_bytes(), filename=str(path))
          print(f'Проверено Python-файлов: {len(paths)}')
          PY
      - name: Проверить синтаксис JavaScript
        run: |
          node --check web/app.js
          node --check web/layout.js
          node --check web/knowledge.js
      - name: Проверить базовые регрессии тестового разделения
        run: python -m unittest discover -s tests -p 'test_test_shard.py' -v
      - name: Проверить веб-макет
        run: node --test tests/layout.test.cjs

  check:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Проверить PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem bootstrap,tests -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
      - name: Подготовить декодер PDF для контрольных документов
        run: python -m pip install "pypdf>=5,<7"
      - name: Проверить сервер, Мозг и запуск BAT — часть ${{ matrix.shard }}
        run: python bootstrap/test_shard.py --shard ${{ matrix.shard }} --total 4
      - name: Проверить 8 внутренних поведенческих экзаменов Мозга
        run: python bootstrap/brain_lab_eight.py --check --output .runtime/quality-reports/brain-lab-eight.json
      - name: Проверить 5 негативных экзаменов и защиту эксперимента
        run: python bootstrap/brain_lab_adversarial.py --check --output .runtime/quality-reports/brain-lab-adversarial.json
      - name: Проверить 12 внутренних аудитов Лаборатории развития
        run: python bootstrap/brain_lab_audit.py --check --output .runtime/quality-reports/brain-lab-audit.json
      - name: Проверить JavaScript и положение окон
        run: |
          node --check web/app.js
          node --check web/layout.js
          node --check web/knowledge.js
          node --test tests/layout.test.cjs

  quality:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Подготовить декодер PDF для контрольных документов
        run: python -m pip install "pypdf>=5,<7"
      - name: Экзамен качества DOCX XLSX PDF и цитирования
        run: python bootstrap/document_quality_exam.py --check --output .runtime/quality-reports
      - name: Измерить качество извлечения знаний и поиска
        run: python bootstrap/quality_eval.py --check --output .runtime/quality-reports
      - name: Проверить 80 сложных документов и качество поиска
        run: python bootstrap/quality_stress.py --check --output .runtime/quality-reports
      - name: Проверить измеритель производительности на 60 документах
        run: python bootstrap/performance_benchmark.py --documents 60 --paragraphs 3 --queries 20 --check --output .runtime/quality-reports
      - name: Сохранить диагностические отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}
          path: .runtime/quality-reports/*.json
          if-no-files-found: warn
