name: Проверка запуска
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Проверить PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem bootstrap,tests -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
      - name: Подготовить декодер PDF для контрольных документов
        run: python -m pip install "pypdf>=5,<7"
      - name: Проверить сервер, Мозг и запуск BAT
        run: python -m unittest discover -s tests -v
      - name: Проверить 12 внутренних аудитов Лаборатории развития
        run: python bootstrap/brain_lab_audit.py --check --output .runtime/quality-reports/brain-lab-audit.json
      - name: Проверить JavaScript и положение окон
        run: |
          node --check web/app.js
          node --check web/layout.js
          node --check web/knowledge.js
          node --test tests/layout.test.cjs

  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Подготовить декодер PDF для контрольных документов
        run: python -m pip install "pypdf>=5,<7"
      - name: Экзамен качества DOCX XLSX PDF и цитирования
        run: python bootstrap/document_quality_exam.py --check --output .runtime/quality-reports
      - name: Измерить качество извлечения знаний и поиска
        run: python bootstrap/quality_eval.py --check --output .runtime/quality-reports
      - name: Проверить 80 сложных документов и качество поиска
        run: python bootstrap/quality_stress.py --check --output .runtime/quality-reports
      - name: Проверить измеритель производительности на 60 документах
        run: python bootstrap/performance_benchmark.py --documents 60 --paragraphs 3 --queries 20 --check --output .runtime/quality-reports
      - name: Сохранить диагностические отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}
          path: .runtime/quality-reports/*.json
          if-no-files-found: warn
